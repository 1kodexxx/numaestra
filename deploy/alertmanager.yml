route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Alertmanager не подставляет переменные окружения в конфиг — впиши
    # реальные значения прямо здесь перед продом (или замени на webhook_configs
    # для Telegram/Slack). Без настроенного receiver алерты будут просто
    # накапливаться в Alertmanager UI и никто их не увидит.
    email_configs:
      - to: "ops@example.com"
        from: "alertmanager@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alertmanager@example.com"
        auth_password: "CHANGE_ME"
        require_tls: true
