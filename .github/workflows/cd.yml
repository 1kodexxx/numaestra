name: CD

# Деплой только после успешного CI на main (или вручную через Run workflow).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 1kodexxx/numaestra

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    # Ручной запуск — всегда; запуск по CI — только если CI прошёл успешно.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      short_sha: ${{ steps.vars.outputs.short }}
    steps:
      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # VITE_YM_COUNTER_ID вшивается на сборке (frontend/.env в CI недоступен).
          # Берём из GitHub-переменной (Settings → Variables), иначе — дефолт.
          build-args: |
            VITE_YM_COUNTER_ID=${{ vars.VITE_YM_COUNTER_ID || '110231053' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Включается репозиторной переменной DEPLOY_ENABLED=true, когда сервер и
    # SSH-секреты готовы. До этого образ всё равно собирается и пушится в GHCR,
    # но шаг деплоя пропускается (не падает красным).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # Прямой ssh без сторонних экшенов: appleboy/ssh-action качает бинарник
      # drone-ssh с GitHub Releases на старте, и эта загрузка периодически падает
      # (Connection reset by peer). Нативный ssh уже есть на раннере — без загрузок.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
          # Пакеты GHCR приватны по умолчанию, поэтому анонимный docker pull с
          # сервера отвечает "denied". Логинимся токеном самого workflow: у него
          # есть packages:read (см. permissions выше), он живёт только до конца
          # job'а и не требует хранить долгоживущий PAT на сервере.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new)

          # Токен уходит по stdin, а не аргументом: аргументы видны в списке
          # процессов сервера любому пользователю, stdin — нет.
          echo "==> Логин на сервере в ghcr.io"
          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # Небольшой ретрай на случай кратковременного сетевого сбоя до сервера.
          for attempt in 1 2 3; do
            if ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "set -e; cd ~/numaestra; git pull --ff-only origin main; IMAGE_TAG='$IMAGE_TAG' bash deploy/deploy.sh"; then
              echo "Деплой успешен (попытка $attempt)"
              exit 0
            fi
            echo "Попытка $attempt не удалась, повтор через 10с…"
            sleep 10
          done
          echo "Деплой не удался после 3 попыток" >&2
          exit 1
