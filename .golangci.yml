run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - errorlint
    - unconvert
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/numaestra/numaestra
  misspell:
    locale: US
  revive:
    rules:
      - name: package-comments
        disabled: true

issues:
  exclude-rules:
    # В тестах допускаем менее строгие проверки.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0
