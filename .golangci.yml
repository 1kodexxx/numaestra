version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # В тестах допускаем менее строгие проверки: прямое сравнение с sentinel-
      # ошибкой (errorlint) и неотловленные ошибки/незакрытые тела ответов
      # безопасны и читаемее, чем errors.Is/defer Close() в каждом assert'е.
      - linters:
          - bodyclose
          - errcheck
          - errorlint
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/numaestra/numaestra
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
