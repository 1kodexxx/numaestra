# Общие переменные окружения для сервисов приложения.
# Вынесено на верхний уровень как extension field (x-prefix), чтобы
# Docker Compose не трактовал блок как сервис.
x-app-env: &app-env
  APP_ENV: dev
  POSTGRES_DSN: postgres://numaestra:numaestra@postgres:5432/numaestra?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ""
  ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-numaestra_test}
  ROBOKASSA_PASS1: ${ROBOKASSA_PASS1:-test_pass1}
  ROBOKASSA_PASS2: ${ROBOKASSA_PASS2:-test_pass2}
  ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-true}
  SUNO_API_URL: ${SUNO_API_URL:-https://api.custom-suno.local}
  SUNO_API_KEY: ${SUNO_API_KEY:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-numaestra-tracks}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # В dev с пустым ключом используется небезопасный дев-ключ (предупреждение в логе).
  # В prod обязателен: openssl rand -hex 32
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: numaestra-postgres
    environment:
      POSTGRES_USER: numaestra
      POSTGRES_PASSWORD: numaestra
      POSTGRES_DB: numaestra
    ports:
      - "5432:5432"
    volumes:
      - numaestra_pgdata:/var/lib/postgresql/data
      # init.sql убран: схема создаётся через migrate.Run при старте сервиса.
      # Новые миграции добавляются как 0002_*.sql, 0003_*.sql и т.д.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numaestra -d numaestra"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: numaestra-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - numaestra_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Режим "all" — API + worker в одном контейнере (dev / small-scale prod).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numaestra-app
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      APP_MODE: all
      HTTP_PORT: "8080"
      HTTP_SHUTDOWN_TIMEOUT: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

  # Режим "worker" — только Asynq-воркер, без HTTP-сервера.
  # Запуск: docker compose --profile worker up -d
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numaestra-worker
    profiles: [worker]
    environment:
      <<: *app-env
      APP_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: убеждаемся, что воркер продолжает опрашивать Redis (Asynq).
    # redis-cli ping идёт через тот же Redis, который использует Asynq —
    # если соединение живо, воркер работает.
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

volumes:
  numaestra_pgdata:
  numaestra_redisdata: