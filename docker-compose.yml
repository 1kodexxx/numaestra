services:
  postgres:
    image: postgres:16-alpine
    container_name: numaestra-postgres
    environment:
      POSTGRES_USER: numaestra
      POSTGRES_PASSWORD: numaestra
      POSTGRES_DB: numaestra
    ports:
      - "5432:5432"
    volumes:
      - numaestra_pgdata:/var/lib/postgresql/data
      # init.sql убран: схема создаётся через migrate.Run при старте сервиса.
      # Новые миграции добавляются как 0002_*.sql, 0003_*.sql и т.д.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numaestra -d numaestra"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: numaestra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numaestra-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      HTTP_PORT: "8080"
      HTTP_SHUTDOWN_TIMEOUT: 15s
      POSTGRES_DSN: postgres://numaestra:numaestra@postgres:5432/numaestra?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      # Robokassa (тестовые значения; переопредели через .env для прод).
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-numaestra_test}
      ROBOKASSA_PASS1: ${ROBOKASSA_PASS1:-test_pass1}
      ROBOKASSA_PASS2: ${ROBOKASSA_PASS2:-test_pass2}
      ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-true}
      # Suno API (через реселлера/прокси).
      SUNO_API_URL: ${SUNO_API_URL:-https://api.custom-suno.local}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      # S3-совместимое хранилище треков.
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-numaestra-tracks}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # LLM (OpenRouter по умолчанию).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s

volumes:
  numaestra_pgdata: