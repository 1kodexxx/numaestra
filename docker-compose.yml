# Общие переменные окружения для сервисов приложения.
# Вынесено на верхний уровень как extension field (x-prefix), чтобы
# Docker Compose не трактовал блок как сервис.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  # Пароль БД параметризован: в dev дефолт numaestra, в prod задайте POSTGRES_PASSWORD.
  POSTGRES_DSN: postgres://numaestra:${POSTGRES_PASSWORD:-numaestra}@postgres:5432/numaestra?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-numaestra_test}
  ROBOKASSA_PASS1: ${ROBOKASSA_PASS1:-test_pass1}
  ROBOKASSA_PASS2: ${ROBOKASSA_PASS2:-test_pass2}
  ROBOKASSA_PASS3: ${ROBOKASSA_PASS3:-}
  ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-true}
  ROBOKASSA_ALLOWED_IPS: ${ROBOKASSA_ALLOWED_IPS:-}
  PRICE_KOPECKS: ${PRICE_KOPECKS:-200000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SUNO_API_URL: ${SUNO_API_URL:-https://api.ttapi.io}
  SUNO_API_KEY: ${SUNO_API_KEY:-}
  SUNO_MODEL: ${SUNO_MODEL:-chirp-v5-5}
  S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-numaestra-tracks}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Email клиенту о готовности заказа (пустой SMTP_HOST → заглушка, только лог).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Numaestra}
  SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
  # Абсолютный URL сайта для ссылок в письмах (обязателен при SMTP в prod).
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
  # Email админа для служебных уведомлений (новая оплата, демо, провал генерации).
  ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
  # В dev с пустым ключом используется небезопасный дев-ключ (предупреждение в логе).
  # В prod обязателен: openssl rand -hex 32
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  # Вход в /admin на фронтенде (POST /admin/login) + секрет подписи cookie-сессии.
  # В dev с пустым ADMIN_SESSION_SECRET используется небезопасный дев-ключ.
  ADMIN_LOGIN: ${ADMIN_LOGIN:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
  # 172.16.0.0/12 — дефолтный диапазон docker-сетей, нужен чтобы Prometheus
  # (profile monitoring) мог скрейпить /metrics из соседнего контейнера.
  METRICS_ALLOWED_IPS: ${METRICS_ALLOWED_IPS:-127.0.0.1/8,::1/128,172.16.0.0/12}

services:
  postgres:
    image: postgres:16-alpine
    container_name: numaestra-postgres
    environment:
      POSTGRES_USER: numaestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numaestra}
      POSTGRES_DB: numaestra
    # Порты на хост НЕ публикуются здесь — это делает docker-compose.override.yml
    # (только dev). В prod БД доступна лишь внутри docker-сети.
    volumes:
      - numaestra_pgdata:/var/lib/postgresql/data
      # init.sql убран: схема создаётся через migrate.Run при старте сервиса.
      # Новые миграции добавляются как 0002_*.sql, 0003_*.sql и т.д.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numaestra -d numaestra"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: numaestra-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --appendfsync everysec
        fi
    # Порт публикуется только в dev через docker-compose.override.yml.
    volumes:
      - numaestra_redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping; else redis-cli ping; fi
      interval: 5s
      timeout: 3s
      retries: 5

  # Режим "all" — API + worker в одном контейнере (dev / small-scale prod).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numaestra-app
    # Порт публикуется только в dev (docker-compose.override.yml). В prod наружу
    # смотрит лишь Caddy (профиль proxy), а до app он ходит по docker-сети.
    environment:
      <<: *app-env
      APP_MODE: all
      HTTP_PORT: "8080"
      HTTP_SHUTDOWN_TIMEOUT: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

  # Режим "worker" — только Asynq-воркер, без HTTP-сервера.
  # Запуск: docker compose --profile worker up -d
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numaestra-worker
    profiles: [worker]
    environment:
      <<: *app-env
      APP_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: убеждаемся, что воркер продолжает опрашивать Redis (Asynq).
    # redis-cli ping идёт через тот же Redis, который использует Asynq —
    # если соединение живо, воркер работает.
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # Reverse-proxy с автоматическим TLS (Let's Encrypt) для прод-деплоя на VPS.
  # Запуск: docker compose -f docker-compose.yml --profile proxy up -d
  # ВАЖНО: задайте DOMAIN и ACME_EMAIL в .env — без них Caddy не выпустит
  # сертификат и не стартует. Дефолты пустые (а не `:?`), чтобы пустые значения
  # не блокировали обычные dev-команды (`docker compose up`), где caddy не нужен.
  caddy:
    image: caddy:2-alpine
    container_name: numaestra-caddy
    profiles: [proxy]
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - numaestra_caddy_data:/data
      - numaestra_caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Ночные дампы Postgres с ротацией (BACKUP_RETENTION_DAYS, по умолчанию 7 дней).
  # Запуск: docker compose --profile backup up -d
  # Дампы складываются в ./backups на хосте и (опционально) грузятся offsite в S3.
  backup:
    image: postgres:16-alpine
    container_name: numaestra-backup
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: numaestra
      PGPASSWORD: ${POSTGRES_PASSWORD:-numaestra}
      PGDATABASE: numaestra
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    entrypoint: ["sh", "/scripts/backup-postgres.sh"]
    volumes:
      - ./deploy/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Мониторинг и алерты. Запуск: docker compose --profile monitoring up -d
  # Prometheus UI: :9090, Alertmanager UI: :9093.
  # Перед продом заполни deploy/alertmanager.yml реальным receiver'ом (email/Telegram/Slack),
  # иначе алерты будут копиться в Alertmanager без уведомления кого-либо.
  prometheus:
    image: prom/prometheus:latest
    container_name: numaestra-prometheus
    profiles: [monitoring]
    # UI-порт не публикуется в проде (доступ через SSH-туннель). В dev его
    # открывает docker-compose.override.yml.
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - numaestra_prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  # Одноразовый init: рендерит конфиг Alertmanager из переменных .env (email через
  # SMTP_*, опционально Telegram) в общий том. Нужен потому, что сам Alertmanager
  # не подставляет env в свой YAML. См. deploy/render-alertmanager.sh.
  alertmanager-config:
    image: alpine:3.19
    container_name: numaestra-alertmanager-config
    profiles: [monitoring]
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-alertmanager@numaestra.ru}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/render-alertmanager.sh"]
    volumes:
      - ./deploy/render-alertmanager.sh:/render-alertmanager.sh:ro
      - numaestra_alertmanager_config:/etc/alertmanager
    restart: "no"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: numaestra-alertmanager
    profiles: [monitoring]
    # UI-порт не публикуется в проде (доступ через SSH-туннель). В dev его
    # открывает docker-compose.override.yml.
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    volumes:
      - numaestra_alertmanager_config:/etc/alertmanager:ro
    restart: unless-stopped

volumes:
  numaestra_alertmanager_config:
  numaestra_pgdata:
  numaestra_redisdata:
  numaestra_caddy_data:
  numaestra_caddy_config:
  numaestra_prometheus_data: