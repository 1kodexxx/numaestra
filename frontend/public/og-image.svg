<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#060d0c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5c0"/>
      <stop offset="1" stop-color="#00bfa5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#00e5c0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00e5c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(100,120)" fill="url(#acc)">
    <rect x="0"   y="34" width="14" height="44" rx="7"/>
    <rect x="26"  y="20" width="14" height="72" rx="7"/>
    <rect x="52"  y="4"  width="14" height="104" rx="7"/>
    <rect x="78"  y="20" width="14" height="72" rx="7"/>
    <rect x="104" y="34" width="14" height="44" rx="7"/>
  </g>
  <text x="246" y="200" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Numaestra</text>

  <!-- headline -->
  <text x="100" y="350" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Песня, написанная</text>
  <text x="100" y="438" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#acc)">лично для вас</text>

  <!-- subline -->
  <text x="100" y="506" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="rgba(255,255,255,0.62)">Опишите повод — получите 4 версии трека за 10 минут</text>

  <!-- pills -->
  <g font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#00e5c0">
    <rect x="100" y="544" width="200" height="52" rx="26" fill="rgba(0,229,192,0.1)" stroke="rgba(0,229,192,0.3)"/>
    <text x="200" y="578" text-anchor="middle">4 версии</text>
    <rect x="316" y="544" width="240" height="52" rx="26" fill="rgba(0,229,192,0.1)" stroke="rgba(0,229,192,0.3)"/>
    <text x="436" y="578" text-anchor="middle">за 10 минут</text>
    <rect x="572" y="544" width="280" height="52" rx="26" fill="rgba(0,229,192,0.1)" stroke="rgba(0,229,192,0.3)"/>
    <text x="712" y="578" text-anchor="middle">без подписок</text>
  </g>
</svg>
